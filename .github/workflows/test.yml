name: Проверки

on:
  push:
    branches: [master, v3]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Графический интерфейс (cmd/shorthand) требует cgo и библиотек X11 —
      # он собирается на Windows; здесь проверяются ядро и стенд экспериментов.
      - name: go vet
        run: go vet ./internal/... ./cmd/stegobench/...
      - name: go test
        run: go test -count=1 ./internal/...
